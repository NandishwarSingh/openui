name: OpenUIPlanner
options:
  bundleIdPrefix: dev.openui
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  OpenUI:
    path: ../../../packages/swift-lang
  Razorpay:
    url: https://github.com/razorpay/razorpay-pod
    exactVersion: 1.5.8
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Planner:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Sources
    dependencies:
      - package: OpenUI
        product: OpenUISwiftUI
      # Razorpay's checkout SDK is iOS only; the Mac app uses its web checkout.
      - package: Razorpay
        product: RazorpayCheckout
        destinationFilters: [iOS]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Planner
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCalendarsFullAccessUsageDescription: Planner reads your schedule and adds the plans you confirm.
        NSRemindersFullAccessUsageDescription: Planner adds reminders for the plans you confirm.
        NSLocationWhenInUseUsageDescription: Planner finds places near you.
        NSCameraUsageDescription: Planner uses the camera when a response asks for a photo, like a receipt.
        NSPhotoLibraryUsageDescription: Planner lets you pick a photo when a response asks for one.
        NSLocalNetworkUsageDescription: Planner talks to the Planner server running on your Mac.
        # UPI apps Razorpay's checkout can hand the payment to.
        LSApplicationQueriesSchemes: [tez, phonepe, paytmmp, credpay, bhim, mobikwik]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        PlannerServerURL: $(PLANNER_SERVER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openui.planner
        PLANNER_SERVER_URL: http://localhost:8787
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Sources/Planner-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: NO
  PlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Planner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.openui.planner.uitests
        TEST_TARGET_NAME: Planner
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Planner:
    build:
      targets:
        Planner: all
        PlannerUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PlannerUITests]
